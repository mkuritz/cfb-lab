<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Viz Builder · CFB Hub · Sports Labs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="cfb.css"><script src="sl-sports.js"></script><script src="navcfg.js"></script><script src="cfb.js"></script><style>.cf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}.cf label{font-size:10.5px;color:var(--mut);font-weight:800;letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;gap:4px}#tip{position:fixed;pointer-events:none;background:#0e172bf0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:none;z-index:9}canvas{width:100%;border-radius:14px;background:#0a1224;border:1px solid var(--line);touch-action:none}</style><script src="https://sportslabshq.com/sl/sl.js?v=10" defer></script></head><body><div class="w">
<h2 style="margin-top:14px">Data viz builder</h2>
<div class="cf"><label>League<select class="v2" id="lg"><option value="cfb">College</option><option value="nfl">NFL</option></select></label><label>Season<select class="v2" id="se"><option>2026</option></select></label><label>Weeks<span style="display:flex;gap:4px"><select class="v2" id="w1"></select><select class="v2" id="w2"></select></span></label><label>X axis<select class="v2" id="xa"></select></label><label>Y axis<select class="v2" id="ya"></select></label><label>Display<select class="v2" id="dm"><option value="logo">Team logos</option><option value="dot">Dots</option></select></label><label>Conference<select class="v2" id="cf"><option value="">All FBS</option></select></label></div>
<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><button class="chip" id="png">⬇ PNG</button><button class="chip" id="share">🔗 Copy share link</button><span class="mut sm" id="msg" style="align-self:center"></span></div>
<canvas id="cv" width="1100" height="760"></canvas><div id="tip"></div><footer>Built from public play-by-play (scrimmage passes and runs, garbage time removed), not opponent-adjusted. EPA = expected points added per play. Success = 50% of yards to go on 1st down, 70% on 2nd, 100% on 3rd/4th. Dashed lines = average of shown teams.</footer></div>
<script>
var M={epa:["EPA/play (offense)",a=>a.xppa/a.xp],depa:["EPA/play allowed (defense)",a=>a.xdppa/a.xdp],pepa:["Pass EPA/play",a=>a.xpp/a.xppn],repa:["Rush EPA/play",a=>a.xrp/a.xrpn],suc:["Success rate (offense)",a=>a.osuc/a.on],dsuc:["Success rate allowed",a=>a.dsuc/a.dn],ypp:["Yards/play",a=>a.oyd/a.on],dypp:["Yards/play allowed",a=>a.dyd/a.dn],psuc:["Pass success rate",a=>a.opsuc/a.opn],rsuc:["Rush success rate",a=>a.orsuc/a.orn],dpsuc:["Pass success allowed",a=>a.dpsuc/a.dpn],drsuc:["Rush success allowed",a=>a.drsuc/a.drn],prate:["Pass rate",a=>a.opn/a.on],exp:["Explosive play rate",a=>a.oexp/a.on],dexp:["Explosive plays allowed",a=>a.dexp/a.dn],skr:["Sack rate allowed",a=>a.osk/a.opn],dskr:["Sack rate (defense)",a=>a.dsk/a.dpn],stuff:["Stuff rate (offense)",a=>a.ostuff/a.orn],aly:["Line yards/carry",a=>a.xly/a.xlyn],hur:["Hurries allowed/game",a=>a.ohur/a.g]};
var INV={depa:1,dsuc:1,dypp:1,dpsuc:1,drsuc:1,dexp:1,skr:1,stuff:1,hur:1};
var Q=new URLSearchParams(location.search),S={w1:+Q.get("w1")||1,w2:+Q.get("w2")||99,x:Q.get("x")||"epa",y:Q.get("y")||"depa",dm:Q.get("dm")||"logo",cf:Q.get("cf")||""};
lg.onchange=function(){if(lg.value=="nfl")location.href=SLTOP.sports.find(s=>s[2]=="nfl")[1].replace("index.html","")+"viz.html"};
fetch("data/viz.json").then(r=>r.json()).then(function(P){var cx=cv.getContext("2d"),IM={},pts=[];var cs=[...new Set(Object.values(P.teams).map(t=>t.conf))].filter(Boolean).sort();cf.innerHTML+=cs.map(c=>"<option>"+c+"</option>").join("");
function opts(){[["x",xa],["y",ya]].forEach(([a,el])=>el.innerHTML=Object.keys(M).map(k=>'<option value="'+k+'"'+(S[a]==k?" selected":"")+'>'+M[k][0]+'</option>').join(""));S.w2=Math.min(S.w2,P.maxw);[w1,w2].forEach((el,i)=>el.innerHTML=Array.from({length:P.maxw},(_,j)=>'<option'+(j+1==(i?S.w2:S.w1)?" selected":"")+'>'+(j+1)+'</option>').join(""));dm.value=S.dm;cf.value=S.cf}
function agg(){var A={};Object.entries(P.tw).forEach(function([k,v]){var [t,w]=k.split("|");w=+w;if(w<S.w1||w>S.w2)return;var a=A[t]=A[t]||{g:0};a.g++;for(var f in v)a[f]=(a[f]||0)+v[f]});
 pts=Object.entries(A).map(function([t,a]){if(S.cf&&P.teams[t].conf!=S.cf)return null;var x=M[S.x][1](a),y=M[S.y][1](a);if(!isFinite(x)||!isFinite(y))return null;return{t:t,x:x,y:y,ab:P.teams[t].ab}}).filter(Boolean)}
function f(k,v){return /epa$/.test(k)?(v>0?"+":"")+v.toFixed(3):k=="ypp"||k=="dypp"||k=="aly"||k=="hur"?v.toFixed(2):(v*100).toFixed(1)+"%"}
function draw(){agg();var W=cv.width,H=cv.height,pad=70;cx.fillStyle="#0a1224";cx.fillRect(0,0,W,H);if(!pts.length)return;
 var xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),dx=(x1-x0)*.06||1,dy=(y1-y0)*.06||1;x0-=dx;x1+=dx;y0-=dy;y1+=dy;
 var X=v=>pad+(v-x0)/(x1-x0)*(W-pad*1.4),Y=v=>INV[S.y]?pad*.6+(v-y0)/(y1-y0)*(H-pad*1.6):H-pad-(v-y0)/(y1-y0)*(H-pad*1.6);var XX=v=>INV[S.x]?W-pad*.4-(X(v)-pad):X(v);
 cx.strokeStyle="#1e2c4a";cx.fillStyle="#8592ad";cx.font="12px Inter,sans-serif";for(var i=0;i<=5;i++){var vx=x0+(x1-x0)*i/5,vy=y0+(y1-y0)*i/5;cx.beginPath();cx.moveTo(XX(vx),pad*.6);cx.lineTo(XX(vx),H-pad);cx.stroke();cx.fillText(f(S.x,vx),XX(vx)-16,H-pad+18);cx.beginPath();cx.moveTo(pad,Y(vy));cx.lineTo(W-pad*.4,Y(vy));cx.stroke();cx.fillText(f(S.y,vy),8,Y(vy)+4)}
 var mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;cx.setLineDash([6,6]);cx.strokeStyle="#38d0f088";cx.beginPath();cx.moveTo(XX(mx),pad*.6);cx.lineTo(XX(mx),H-pad);cx.moveTo(pad,Y(my));cx.lineTo(W-pad*.4,Y(my));cx.stroke();cx.setLineDash([]);
 cx.fillStyle="#eef2fa";cx.font="bold 14px Inter,sans-serif";cx.fillText(M[S.x][0]+(INV[S.x]?" (better →)":" →"),W/2-120,H-22);cx.save();cx.translate(20,H/2+80);cx.rotate(-Math.PI/2);cx.fillText(M[S.y][0]+" (better ↑)",0,0);cx.restore();
 cx.font="bold 13px Inter";cx.fillStyle="#38d0f0";cx.fillText("SPORTS LABS · CFB HUB · 2026 · Wk "+S.w1+"–"+S.w2+(S.cf?" · "+S.cf:""),pad,30);
 var sz=pts.length>80?22:32;pts.forEach(function(p){p.px=XX(p.x);p.py=Y(p.y);var im=IM[p.t];if(S.dm=="logo"&&im&&im.complete&&im.naturalWidth)cx.drawImage(im,p.px-sz/2,p.py-sz/2,sz,sz);else{cx.fillStyle="#38d0f0";cx.beginPath();cx.arc(p.px,p.py,5,0,7);cx.fill()}})}
 function load(){pts.forEach(function(p){if(!IM[p.t]){var im=new Image();im.crossOrigin="anonymous";im.onload=()=>{clearTimeout(load.t);load.t=setTimeout(draw,80)};im.src=P.teams[p.t].logo.replace("/500/","/500/");IM[p.t]=im}})}
 function upd(){history.replaceState(null,"","?"+new URLSearchParams(S));draw();load()}
 [xa,ya,w1,w2,dm,cf].forEach(el=>el.onchange=function(){S.x=xa.value;S.y=ya.value;S.w1=+w1.value;S.w2=Math.max(+w1.value,+w2.value);S.dm=dm.value;S.cf=cf.value;upd()});
 cv.onpointermove=function(e){var r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*cv.width/r.width,my=(e.clientY-r.top)*cv.height/r.height,b=null,bd=400;pts.forEach(p=>{var d=(p.px-mx)**2+(p.py-my)**2;if(d<bd){bd=d;b=p}});if(b){tip.style.display="block";tip.style.left=e.clientX+12+"px";tip.style.top=e.clientY+12+"px";tip.innerHTML="<b>"+b.ab+"</b><br>"+M[S.x][0]+": "+f(S.x,b.x)+"<br>"+M[S.y][0]+": "+f(S.y,b.y)}else tip.style.display="none"};cv.onpointerleave=()=>tip.style.display="none";
 png.onclick=function(){try{var a=document.createElement("a");a.download="sportslabs-cfb-"+S.x+"-vs-"+S.y+".png";a.href=cv.toDataURL("image/png");a.click();msg.textContent="Downloaded."}catch(e){msg.textContent="Download failed."}};
 share.onclick=function(){var u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>msg.textContent="Link copied.",()=>{msg.textContent=u})};
 opts();upd()});
</script></body></html>
