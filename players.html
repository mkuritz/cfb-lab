<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Players & Usage · CFB Hub · Sports Labs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="cfb.css"><script src="sl-sports.js"></script><script src="navcfg.js"></script><script src="tailcard.js?v=1"></script><script src="cfb.js"></script><script src="https://sportslabshq.com/sl/sl.js?v=11" defer></script></head><body><div class="w"><h2 style="margin-top:14px">Players, Depth Chart Roles &amp; Usage Shares</h2><p class="mut sm">Browse 5,000+ FBS players with verified Starter / Depth roles (QB1, RB1, WR1-3, TE1), overall play usage %, carry share %, reception share %, and EPA/play. Tap any player for their full Game Log &amp; Prop Intel Drawer.</p><div class="ctl"><input class="v2" id="q" placeholder="Search a player or team" style="background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 10px"><select class="v2" id="ps"><option value="">All positions</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option value="D">Defense</option></select><select class="v2" id="rl"><option value="">All Depth Roles</option><option value="st">Verified Starters Only</option></select></div><div class="card wrap" style="padding:0" id="out"></div></div><script>CFB.data(function(D){var E=CFB.E;var DEF=/^(DL|DE|DT|LB|OLB|ILB|CB|S|DB|NT|EDGE)$/;
function draw(){var s=q.value.toLowerCase(),p=ps.value,R=D.players.filter(x=>(!p||(p=="D"?DEF.test(x.pos):x.pos==p))&&(rl.value!="st"||x.starter)&&(!s||x.nm.toLowerCase().includes(s)||(D.teams[x.t].nm||"").toLowerCase().includes(s)||(D.teams[x.t].ab||"").toLowerCase().includes(s)));if(p=="D")R.sort((a,b)=>b.tkl+5*b.sck-(a.tkl+5*a.sck));
out.innerHTML='<table><tr><th>Player</th><th>Role &amp; Usage Shares</th><th>Team</th><th>GP</th><th>EPA/play</th><th>Pass yds</th><th>Rush yds</th><th>Rec yds</th><th>TDs</th><th>Tkl / Sacks</th></tr>'+R.slice(0,150).map(x=>'<tr><td><a href="#" class="plink" data-cfb-player="'+x.id+'" style="color:var(--txt);font-weight:700">'+E(x.nm)+'</a></td><td>'+CFB.roleBadge(x)+'</td><td>'+CFB.logo(x.t)+' '+E(D.teams[x.t].ab)+'</td><td>'+x.gp+'</td><td>'+(x.epa!=null?(x.epa>0?"+":"")+x.epa:"—")+'</td><td>'+x.pyd+'</td><td>'+x.ryd+'</td><td>'+x.reyd+'</td><td>'+(x.td||0)+'</td><td>'+x.tkl+' / '+x.sck+'</td></tr>').join("")+'</table>'+(R.length>150?'<p class="mut sm" style="padding:8px">Showing 150 of '+R.length+'. Search to narrow.</p>':'')}
q.oninput=ps.onchange=rl.onchange=draw;draw()})</script></body></html>
