<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player · CFB Hub · Sports Labs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="cfb.css"><script src="sl-sports.js"></script><script src="navcfg.js"></script><script src="tailcard.js?v=1"></script><script src="cfb.js"></script><script src="https://sportslabshq.com/sl/sl.js?v=10" defer></script></head><body><div class="w"><div id="out"><p class="mut" style="margin-top:20px">Loading…</p></div></div><script>CFB.data(function(D){var E=CFB.E,id=new URLSearchParams(location.search).get("id");fetch("data/players/"+encodeURIComponent(id)+".json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(function(p){var T=D.teams[p.t],s=p.s;document.title=p.nm+" · CFB Hub";
var tiles=[["Pass yds","pyd"],["Pass TD","ptd"],["Rush yds","ryd"],["Rush TD","rtd"],["Rec","rec"],["Rec yds","reyd"],["Rec TD","retd"],["Tackles","tkl"],["Sacks","sck"],["TFL","tfl"]].filter(x=>{var v=s[x[1]],k=x[1];return /yd$/.test(k)?v>=30:/td$/.test(k)?v>=1&&s[k.replace("td","yd").replace("ptd","pyd").replace("rtd","ryd")]>=30:k=="rec"||k=="tkl"?v>=3:v>=1}).slice(0,6);
var inj=(D.inj[p.t]||[]).filter(x=>x.n==p.nm);
var gl=p.g.slice().reverse();function sh(v){return v==null?"—":(v*100).toFixed(0)+"%"}
out.innerHTML='<div class="card" style="margin-top:14px;padding:16px;background:linear-gradient(120deg,'+T.col+'55,#0d1629 60%)"><div style="display:flex;gap:14px;align-items:center">'+CFB.head(p.id,p.nm,p.hs,T.col,92)+'<div><div style="font-size:22px;font-weight:900">'+E(p.nm)+'</div><div class="mut">'+CFB.logo(p.t,20)+' '+E(T.nm)+' · '+E(p.pos)+(p.j?' · #'+E(p.j):'')+' · '+E(T.conf||"")+'</div>'+(inj.length?'<div class="dn sm" style="margin-top:4px">'+E(inj[0].st)+' · '+E(inj[0].d||"")+'</div>':'')+'</div></div></div>'+
'<div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">'+tiles.map(x=>{var rk=p.rk[x[1]];return '<div class="tile"><div class="l">'+x[0]+'</div><div class="v">'+s[x[1]]+'</div><div class="mut sm">'+(rk?CFB.ord(rk[0])+" of "+rk[1]+" "+E(p.pos)+"s":(s[x[1]]/s.gp).toFixed(1)+"/g")+'</div></div>'}).join("")+'</div>'+
(p.use?'<h3>Usage and efficiency</h3><div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">'+[["Usage (all)",p.use.overall],["Pass usage",p.use.pass],["Rush usage",p.use.rush],["3rd-down usage",p.use.thirdDown]].filter(x=>x[1]!=null).map(x=>'<div class="tile"><div class="l">'+x[0]+'</div><div class="v">'+(x[1]*100).toFixed(1)+'%</div><div class="mut sm">of team plays</div></div>').join('')+(p.ppa&&p.ppa.all!=null?'<div class="tile"><div class="l">EPA/play</div><div class="v">'+(p.ppa.all>0?'+':'')+p.ppa.all.toFixed(2)+'</div><div class="mut sm">on his plays</div></div>':'')+'</div>':'')+'<h3>Game log</h3><div class="card wrap" style="padding:0"><table><tr><th>Wk</th><th>Opp</th><th>Pass</th><th>Rush</th><th>Rec</th><th>Def</th><th>Carry share</th><th>Rec share</th></tr>'+gl.map(x=>'<tr><td>'+x.wk+'</td><td>'+E(x.ha)+' '+CFB.logo(x.opp,16)+' '+E(x.oab||"FCS")+'</td><td>'+(x.att?x.cmp+"/"+x.att+", "+x.pyd+" yds, "+x.ptd+" TD"+(x.int?", "+x.int+" INT":""):"—")+'</td><td>'+(x.car?x.car+" car, "+x.ryd+" yds"+(x.rtd?", "+x.rtd+" TD":""):"—")+'</td><td>'+(x.rec?x.rec+" rec, "+x.reyd+" yds"+(x.retd?", "+x.retd+" TD":""):"—")+'</td><td>'+(x.tkl||x.sck?(x.tkl||0)+" tkl"+(x.sck?", "+x.sck+" sk":""):"—")+'</td><td>'+sh(x.cs)+'</td><td>'+sh(x.rs)+'</td></tr>').join("")+'</table></div>'+
'<p class="mut sm">Carry and rec share = share of the team\'s carries and receptions in each game (from box scores). Usage = share of the team’s plays that involve the player (his passes, carries and targets), garbage time removed. Snap counts are not available. Positional rank is among FBS players at the same roster position.</p>'
}).catch(()=>{out.innerHTML='<p class="mut" style="margin-top:20px">Player not found. <a href="players.html">Browse players</a>.</p>'})})</script></body></html>
