<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Defense vs Position · CFB Hub · Sports Labs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="cfb.css"><script src="sl-sports.js"></script><script src="navcfg.js"></script><script src="tailcard.js?v=1"></script><script src="cfb.js"></script><script src="https://sportslabshq.com/sl/sl.js?v=11" defer></script></head><body><div class="w"><h2 style="margin-top:14px">Defense vs position</h2><p class="mut sm">Yards and touchdowns allowed per game to each offensive position (box-score totals by roster position, FBS defenses). Higher = softer matchup.</p>
<div class="ctl"><select class="v2" id="ps"><option>QB</option><option>RB</option><option selected>WR</option><option>TE</option></select><select class="v2" id="cf"><option value="">All FBS</option></select></div><div class="card wrap" style="padding:0" id="out"></div>
<footer>QB yards include passing and rushing. Positions come from current team rosters. Not adjusted for opponent offense.</footer></div><script>CFB.data(function(D){var E=CFB.E;cf.innerHTML+=[...new Set(D.dvp.map(r=>r.conf))].sort().map(c=>"<option>"+E(c)+"</option>").join("");
function draw(){var p=ps.value,L=D.dvp.slice().sort((a,b)=>b[p+"y"]-a[p+"y"]),n=L.length;L.forEach((r,i)=>r._rk=i+1);var R=L.filter(r=>!cf.value||r.conf==cf.value);
out.innerHTML='<table><tr><th>Softness rank</th><th>Defense</th><th>Conf</th><th>'+p+' yds/g allowed</th><th>'+p+' TD/g</th></tr>'+R.map(r=>{var q=1-(r._rk-1)/(n-1);return '<tr><td>'+r._rk+'</td><td>'+CFB.logo(r.id)+' <b>'+E(r.ab)+'</b></td><td class="mut sm">'+E(r.conf)+'</td><td class="gcell" style="background:'+(q>.66?"#2f7a2a":q>.33?"#3a4a6a":"#8a2d38")+'">'+r[p+"y"]+'</td><td>'+r[p+"t"]+'</td></tr>'}).join("")+'</table>'}
ps.onchange=cf.onchange=draw;draw()})</script></body></html>
